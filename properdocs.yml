---
site_name: Learning Without Borders Europe
site_description: Open Education for Everyone, Everywhere. Free, accessible, open-source learning resources for people across Europe and beyond.
site_url: https://openlearneurope.github.io/courses/

nav:
  - Home: 'index.md'
  - Courses:
      - Course catalogue: 'courses/index.md'
      - Parallel programming:
          - CPU:
              - OpenMP:
                  - Introduction: 'courses/openmp/index.md'
                  - Preparation: 'courses/openmp/preparation.md'
                  - Hands-On:
                      - Parallel Region: 'courses/openmp/exercise-1.md'
                      - Data Sharing Attribute: 'courses/openmp/exercise-2.md'
                      - Work Sharing Constructs(loop): 'courses/openmp/exercise-3.md'
                      - Work Sharing Constructs(loop-scheduling): 'courses/openmp/exercise-4.md'
                      - Worksharing Constructs(others): 'courses/openmp/exercise-5.md'
                      - SIMD and Others: 'courses/openmp/exercise-6.md'
                      - Profiling and Performance: 'courses/openmp/profiling.md'
          - GPU:
              - CUDA:
                  - Introduction: 'courses/cuda/index.md'
                  - Preparation: 'courses/cuda/preparation.md'
                  - Hands-on:
                      - Hello world: 'courses/cuda/exercise-1.md'
                      - Vector addition: 'courses/cuda/exercise-2.md'
                      - Matrix multiplication: 'courses/cuda/exercise-3.md'
                      - Shared memory: 'courses/cuda/exercise-4.md'
                      - Unified memory: 'courses/cuda/exercise-5.md'
                      - Profiling and performance: 'courses/cuda/profiling.md'
              - OpenACC:
                  - Introduction: 'courses/openacc/index.md'
                  - Preparation: 'courses/openacc/preparation.md'
                  - Hands-on:
                      - Compute constructs and parallelize loops: 'courses/openacc/exercise-1.md'
                      - Data locality: 'courses/openacc/exercise-2.md'
                      - Optimize loops: 'courses/openacc/exercise-3.md'
                      - Unified memory: 'courses/openacc/exercise-4.md'
                      - Profiling and performance: 'courses/openacc/profiling.md'
  - Contact: 'contact.md'
hooks:
  - scripts/extra.py

extra_javascript:
  - javascripts/feedback.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

theme:
  name: materialx
  logo: assets/lwbe-logo.svg
  features:
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - content.action.edit
    - content.action.view
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - header.autohide
    - toc.follow
    - content.code.copy
    - content.code.select
    - content.code.annotate
  language: en
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      primary: dark blue
      accent: blue
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      primary: dark blue
      accent: blue
  icon:
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
    repo: fontawesome/brands/git-alt
    edit: material/pencil
    view: material/eye

markdown_extensions:
  - meta
  - attr_list
  - md_in_html
  - mdx_truly_sane_lists
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      linenums_style: pymdownx.inline
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - footnotes
  - admonition
  - codehilite:
      guess_lang: false
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols:
      fractions: false
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.keys
  - pymdownx.arithmatex:
      generic: true
  - markdown_include.include:
      base_path: docs

plugins:
  - search
  - rss:
      date_from_meta:
        datetime_format: "%Y-%m-%d %H:%M"
  - minify:
      minify_html: true
  - glightbox
  - document-dates:
      position: bottom
      type: datetime
      date_format: "%d %B %Y"
  - include-markdown
  - site-urls

extra_css:
  - stylesheets/extra.css

# Google Analytics intentionally left out for now — add your own property under
# extra.analytics when ready (https://squidfunk.github.io/mkdocs-material/setup/setting-up-site-analytics/).
extra:
  analytics:
    provider: google
    property: G-CNGV42X4RF
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by using our
            <a href="https://github.com/OpenLearnEurope/courses/issues/new?title=[Feedback]+{title}+-+{url}" target="_blank" rel="noopener">feedback form</a>.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/OpenLearnEurope/courses
      name: Contact us on GitHub


# Dual licence: educational content under Creative Commons, code under the EU's EUPL.
# For EUPL-only, delete the "content under ... CC BY 4.0," clause below.
copyright: >-
  Copyright &copy; 2026-{current_year} Learning Without Borders Europe —
  content under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>,
  code under the <a href="https://eupl.eu/" target="_blank" rel="noopener">EUPL-1.2</a>

repo_url: https://github.com/OpenLearnEurope/courses/
repo_name: OpenLearnEurope/courses
edit_uri: edit/main/docs/
