<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Learning Without Borders Europe — a globe beneath seven stars for the seven continents">
  <defs>
    <path id="lwbe-star" d="M0,-3.2 L0.78,-1.07 L3.04,-0.99 L1.27,0.4 L1.88,2.59 L0,1.34 L-1.88,2.59 L-1.27,0.4 L-3.04,-0.99 L-0.78,-1.07 Z"/>
  </defs>
  <!-- globe -->
  <circle cx="32" cy="39" r="15" fill="#1565c0"/>
  <!-- borderless grid -->
  <g fill="none" stroke="#90caf9" stroke-width="1.4" stroke-linecap="round">
    <ellipse cx="32" cy="39" rx="6.5" ry="15"/>
    <line x1="17" y1="39" x2="47" y2="39"/>
    <path d="M20.5 29.5 q11.5 5 23 0"/>
    <path d="M20.5 48.5 q11.5 -5 23 0"/>
  </g>
  <!-- arc of seven stars (seven continents) -->
  <g fill="#ffca28">
    <use href="#lwbe-star" x="54.5" y="26"/>
    <use href="#lwbe-star" x="48.7" y="19.1"/>
    <use href="#lwbe-star" x="40.9" y="14.6"/>
    <use href="#lwbe-star" x="32"   y="13"/>
    <use href="#lwbe-star" x="23.1" y="14.6"/>
    <use href="#lwbe-star" x="15.3" y="19.1"/>
    <use href="#lwbe-star" x="9.5"  y="26"/>
  </g>
</svg>
