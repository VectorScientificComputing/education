---
site_name: Vector Scientific Computing - Education
site_description: Open Education for Everyone, Everywhere. Free, accessible, open-source learning resources for people across Europe and beyond.
site_url: https://vectorscientificcomputing.github.io/education/

nav:
  - Home: 'index.md'
  - Courses:
      - Course catalogue: 'courses/index.md'
      - Parallel programming:
          - CPU:
              - OpenMP:
                  - Introduction: 'courses/openmp/index.md'
                  - Preparation: 'courses/openmp/preparation.md'
                  - Hands-On:
                      - Parallel Region: 'courses/openmp/exercise-1.md'
                      - Data Sharing Attribute: 'courses/openmp/exercise-2.md'
                      - Work Sharing Constructs(loop): 'courses/openmp/exercise-3.md'
                      - Work Sharing Constructs(loop-scheduling): 'courses/openmp/exercise-4.md'
                      - Worksharing Constructs(others): 'courses/openmp/exercise-5.md'
                      - SIMD and Others: 'courses/openmp/exercise-6.md'
                      - Profiling and Performance: 'courses/openmp/profiling.md'
          - GPU:
              - CUDA:
                  - Introduction: 'courses/cuda/index.md'
                  - Preparation-HPC: 'courses/cuda/preparation.md'
                  - Preparation-Cloud: 'courses/cuda/google-gpu-colab-cuda-guide.md'
                  - Hands-on:
                      - Hello world: 'courses/cuda/exercise-1.md'
                      - Vector addition: 'courses/cuda/exercise-2.md'
                      - Matrix multiplication: 'courses/cuda/exercise-3.md'
                      - Shared memory: 'courses/cuda/exercise-4.md'
                      - Unified memory: 'courses/cuda/exercise-5.md'
                      - Profiling and performance: 'courses/cuda/profiling.md'
              - OpenACC:
                  - Introduction: 'courses/openacc/index.md'
                  - Preparation: 'courses/openacc/preparation.md'
                  - Hands-on:
                      - Compute constructs and parallelize loops: 'courses/openacc/exercise-1.md'
                      - Data locality: 'courses/openacc/exercise-2.md'
                      - Optimize loops: 'courses/openacc/exercise-3.md'
                      - Unified memory: 'courses/openacc/exercise-4.md'
                      - Profiling and performance: 'courses/openacc/profiling.md'
  - Contact: 'contact.md'

extra_javascript:
  - javascripts/feedback.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

theme:
  name: material
  logo: assets/lwbe-logo.svg
  features:
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - content.action.edit
    - content.action.view
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - header.autohide
    - toc.follow
    - content.code.copy
    - content.code.select
    - content.code.annotate
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      primary: teal
      accent: cyan
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      primary: teal
      accent: cyan
  icon:
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
    repo: fontawesome/brands/git-alt
    edit: material/pencil
    view: material/eye

markdown_extensions:
  - meta
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      linenums_style: pymdownx.inline
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - footnotes
  - admonition
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols:
      fractions: false
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.keys
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - glightbox

extra_css:
  - stylesheets/extra.css

extra:
  analytics:
    provider: google
    property: G-CNGV42X4RF
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by using our
            <a href="https://github.com/VectorScientificComputing/education/issues/new?title=[Feedback]+{title}+-+{url}" target="_blank" rel="noopener">feedback form</a>.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/VectorScientificComputing/education
      name: Contact us on GitHub

copyright: >-
  Copyright &copy; 2026 Vector Scientific Computing Education —
  content under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>,
  code under the <a href="https://eupl.eu/" target="_blank" rel="noopener">EUPL-1.2</a>

repo_url: https://github.com/VectorScientificComputing/education/
repo_name: VectorScientificComputing/education
edit_uri: edit/main/docs/
